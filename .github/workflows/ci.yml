name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EffectViewer.Tests/EffectViewer.Tests.csproj

      - name: Build core
        run: dotnet build EffectViewer/EffectViewer.csproj --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test EffectViewer.Tests/EffectViewer.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults
