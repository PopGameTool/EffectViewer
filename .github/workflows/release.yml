name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with or without the v prefix. Defaults to Directory.Build.props.
        required: false
        type: string
      create_release:
        description: Create a draft GitHub release and upload artifacts.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version sync
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $versionPrefix = $props.SelectSingleNode("//VersionPrefix").InnerText.Trim()

          if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME.StartsWith("v")) {
            $version = $env:REF_NAME.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION.Trim()
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          } else {
            $version = $versionPrefix
          }

          if ($version -notmatch "^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$") {
            throw "Release version '$version' is not a supported semantic version."
          }

          if ($versionPrefix -ne $version) {
            throw "Directory.Build.props VersionPrefix '$versionPrefix' does not match release version '$version'."
          }

          $android = [xml](Get-Content EffectViewer.Android/EffectViewer.Android.csproj)
          $androidDisplayVersion = $android.SelectSingleNode("//ApplicationDisplayVersion").InnerText.Trim()
          if ($androidDisplayVersion -ne $version) {
            throw "Android ApplicationDisplayVersion '$androidDisplayVersion' does not match release version '$version'."
          }

          $macos = [xml](Get-Content EffectViewer.macOS/EffectViewer.macOS.csproj)
          $macosDisplayVersion = $macos.SelectSingleNode("//ApplicationDisplayVersion").InnerText.Trim()
          if ($macosDisplayVersion -ne $version) {
            throw "macOS ApplicationDisplayVersion '$macosDisplayVersion' does not match release version '$version'."
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $headingPattern = "(?m)^##\s+$escapedVersion\s+-\s+\d{4}-\d{2}-\d{2}\s*$"
          $heading = [regex]::Match($changelog, $headingPattern)
          if (-not $heading.Success) {
            throw "CHANGELOG.md must contain a dated '## $version - YYYY-MM-DD' section before releasing."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=v$version" >> $env:GITHUB_OUTPUT

  test:
    name: Build and test release candidate
    runs-on: ubuntu-latest
    needs: validate
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore EffectViewer.Tests/EffectViewer.Tests.csproj

      - name: Restore Desktop
        run: dotnet restore EffectViewer.Desktop/EffectViewer.Desktop.csproj

      - name: Restore Browser workload
        run: dotnet workload restore EffectViewer.Browser/EffectViewer.Browser.csproj --skip-manifest-update

      - name: Restore Browser
        run: dotnet restore EffectViewer.Browser/EffectViewer.Browser.csproj

      - name: Build core
        run: dotnet build EffectViewer/EffectViewer.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Build Desktop
        run: dotnet build EffectViewer.Desktop/EffectViewer.Desktop.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Build Browser
        run: dotnet build EffectViewer.Browser/EffectViewer.Browser.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Test
        run: >
          dotnet test EffectViewer.Tests/EffectViewer.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults
          /p:Version=${{ needs.validate.outputs.version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  publish-desktop:
    name: Publish Desktop (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs:
      - validate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Desktop
        run: >
          dotnet publish EffectViewer.Desktop/EffectViewer.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/publish/desktop-${{ matrix.rid }}
          /p:Version=${{ needs.validate.outputs.version }}

      - name: Pack Desktop artifact
        id: pack
        shell: pwsh
        run: |
          $publishDir = "artifacts/publish/desktop-${{ matrix.rid }}"
          $artifactBase = "effectviewer-${{ needs.validate.outputs.version }}-desktop-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path artifacts/dist -Force | Out-Null

          if ("${{ matrix.archive }}" -eq "zip") {
            $archivePath = "artifacts/dist/$artifactBase.zip"
            Compress-Archive -Path "$publishDir/*" -DestinationPath $archivePath -Force
          } else {
            $archivePath = "artifacts/dist/$artifactBase.tar.gz"
            tar -czf $archivePath -C $publishDir .
          }

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-desktop-${{ matrix.rid }}
          path: ${{ steps.pack.outputs.archive_path }}
          if-no-files-found: error

  publish-browser:
    name: Publish Browser
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Browser workload
        run: dotnet workload restore EffectViewer.Browser/EffectViewer.Browser.csproj --skip-manifest-update

      - name: Publish Browser
        run: >
          dotnet publish EffectViewer.Browser/EffectViewer.Browser.csproj
          --configuration Release
          --output artifacts/publish/browser
          /p:Version=${{ needs.validate.outputs.version }}

      - name: Pack Browser artifact
        id: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/dist -Force | Out-Null
          $archivePath = "artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-browser.zip"
          Compress-Archive -Path "artifacts/publish/browser/*" -DestinationPath $archivePath -Force
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Upload Browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-browser
          path: ${{ steps.pack.outputs.archive_path }}
          if-no-files-found: error

  github-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish-desktop
      - publish-browser
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: effectviewer-${{ needs.validate.outputs.version }}-*
          merge-multiple: true

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+$([regex]::Escape($version))\s+-\s+\d{4}-\d{2}-\d{2}\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if (-not $match.Success) {
            throw "Could not extract release notes for $version from CHANGELOG.md."
          }

          $body = $match.Groups["body"].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "Release $version."
          }

          $body | Set-Content release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: EffectViewer ${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: release-artifacts/*
