name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, with or without the v prefix. Defaults to Directory.Build.props.
        required: false
        type: string
      create_release:
        description: Create a draft GitHub release and upload artifacts.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version sync
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $versionPrefix = $props.SelectSingleNode("//VersionPrefix").InnerText.Trim()

          if ($env:EVENT_NAME -eq "push" -and $env:REF_NAME.StartsWith("v")) {
            $version = $env:REF_NAME.Substring(1)
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $version = $env:INPUT_VERSION.Trim()
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          } else {
            $version = $versionPrefix
          }

          if ($version -notmatch "^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$") {
            throw "Release version '$version' is not a supported semantic version."
          }

          if ($versionPrefix -ne $version) {
            throw "Directory.Build.props VersionPrefix '$versionPrefix' does not match release version '$version'."
          }

          $android = [xml](Get-Content EffectViewer.Android/EffectViewer.Android.csproj)
          $androidDisplayVersion = $android.SelectSingleNode("//ApplicationDisplayVersion").InnerText.Trim()
          if ($androidDisplayVersion -ne $version) {
            throw "Android ApplicationDisplayVersion '$androidDisplayVersion' does not match release version '$version'."
          }

          $macos = [xml](Get-Content EffectViewer.macOS/EffectViewer.macOS.csproj)
          $macosDisplayVersion = $macos.SelectSingleNode("//ApplicationDisplayVersion").InnerText.Trim()
          if ($macosDisplayVersion -ne $version) {
            throw "macOS ApplicationDisplayVersion '$macosDisplayVersion' does not match release version '$version'."
          }

          $ios = [xml](Get-Content EffectViewer.iOS/EffectViewer.iOS.csproj)
          $iosDisplayVersion = $ios.SelectSingleNode("//ApplicationDisplayVersion").InnerText.Trim()
          if ($iosDisplayVersion -ne $version) {
            throw "iOS ApplicationDisplayVersion '$iosDisplayVersion' does not match release version '$version'."
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $headingPattern = "(?m)^##\s+$escapedVersion\s+-\s+\d{4}-\d{2}-\d{2}\s*$"
          $heading = [regex]::Match($changelog, $headingPattern)
          if (-not $heading.Success) {
            throw "CHANGELOG.md must contain a dated '## $version - YYYY-MM-DD' section before releasing."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=v$version" >> $env:GITHUB_OUTPUT

  test:
    name: Build and test release candidate
    runs-on: ubuntu-latest
    needs: validate
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore EffectViewer.Tests/EffectViewer.Tests.csproj

      - name: Restore Desktop
        run: dotnet restore EffectViewer.Desktop/EffectViewer.Desktop.csproj

      - name: Restore Windows
        run: dotnet restore EffectViewer.Windows/EffectViewer.Windows.csproj

      - name: Restore Browser workload
        run: dotnet workload restore EffectViewer.Browser/EffectViewer.Browser.csproj --skip-manifest-update

      - name: Restore Browser
        run: dotnet restore EffectViewer.Browser/EffectViewer.Browser.csproj

      - name: Build core
        run: dotnet build EffectViewer/EffectViewer.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Build Desktop
        run: dotnet build EffectViewer.Desktop/EffectViewer.Desktop.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Build Windows
        run: dotnet build EffectViewer.Windows/EffectViewer.Windows.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Build Browser
        run: dotnet build EffectViewer.Browser/EffectViewer.Browser.csproj --configuration Release --no-restore /p:Version=${{ needs.validate.outputs.version }}

      - name: Test
        run: >
          dotnet test EffectViewer.Tests/EffectViewer.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults
          /p:Version=${{ needs.validate.outputs.version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  publish-windows:
    name: Publish Windows
    runs-on: windows-latest
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64 and arm64
        shell: pwsh
        run: ./scripts/release/publish-windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-windows
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-windows-*.zip
          if-no-files-found: error

  publish-linux:
    name: Publish Linux
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Publish Linux x64 and arm64
        shell: bash
        run: scripts/release/publish-linux-docker.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-linux
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-linux-*.tar.gz
          if-no-files-found: error

  publish-browser:
    name: Publish Browser
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Browser workload
        run: dotnet workload restore EffectViewer.Browser/EffectViewer.Browser.csproj --skip-manifest-update

      - name: Publish Browser
        shell: bash
        run: scripts/release/publish-browser.sh

      - name: Upload Browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-browser
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-browser.zip
          if-no-files-found: error

  publish-macos:
    name: Publish macOS
    runs-on: macos-26
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
      MACOS_RUNTIME: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install macOS workload
        run: dotnet workload install macos --version 10.0.200

      - name: Publish macOS DMG
        shell: bash
        run: scripts/release/publish-macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-macos
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-macos-*.dmg
          if-no-files-found: error

  publish-ios:
    name: Publish iOS
    runs-on: macos-26
    needs:
      - validate
      - test
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
      IOS_RUNTIME: ios-arm64
      IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
      IOS_CODESIGN_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
      IOS_CODESIGN_KEYCHAIN: ${{ secrets.IOS_CODESIGN_KEYCHAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios --version 10.0.200

      - name: Publish iOS IPA
        shell: bash
        run: scripts/release/publish-ios.sh

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-ios
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-ios-*.ipa
          if-no-files-found: error

  publish-android:
    name: Publish Android (${{ matrix.host }})
    runs-on: ${{ matrix.os }}
    needs:
      - validate
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
          - os: windows-latest
            host: windows
          - os: macos-latest
            host: macos
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.validate.outputs.version }}
      HOST_LABEL: ${{ matrix.host }}
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.host != 'windows'
        shell: bash
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Install Android NDK (Windows)
        if: matrix.host == 'windows'
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME "cmdline-tools/latest/bin/sdkmanager.bat"
          & $sdkManager "ndk;$env:ANDROID_NDK_VERSION"

      - name: Restore Android workload
        run: dotnet workload restore EffectViewer.Android/EffectViewer.Android.csproj --skip-manifest-update

      - name: Publish Android
        if: matrix.host != 'windows'
        shell: bash
        run: scripts/release/publish-android.sh

      - name: Publish Android (Windows)
        if: matrix.host == 'windows'
        shell: pwsh
        run: ./scripts/release/publish-android.ps1

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectviewer-${{ needs.validate.outputs.version }}-android-${{ matrix.host }}
          path: artifacts/dist/effectviewer-${{ needs.validate.outputs.version }}-android-*-${{ matrix.host }}.*
          if-no-files-found: error

  github-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish-windows
      - publish-linux
      - publish-browser
      - publish-macos
      - publish-ios
      - publish-android
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: effectviewer-${{ needs.validate.outputs.version }}-*
          merge-multiple: true

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+$([regex]::Escape($version))\s+-\s+\d{4}-\d{2}-\d{2}\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          $match = [regex]::Match($changelog, $pattern)

          if (-not $match.Success) {
            throw "Could not extract release notes for $version from CHANGELOG.md."
          }

          $body = $match.Groups["body"].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "Release $version."
          }

          $body | Set-Content release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: EffectViewer ${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: release-artifacts/*
